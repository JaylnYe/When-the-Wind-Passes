<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3eb"><title>风经过 · 一枝练习</title><meta name="description" content="划过一根枝条，看看风如何留下痕迹。一个关于风、叶片与回弹的交互样片。"><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="wordmark" href="./"><span class="mark">⌁</span> 风经过</a><span class="edition">一枝练习 <i></i> 交互样片 01</span></header><section class="intro"><p class="eyebrow">A SMALL STUDY OF WIND</p><h1>让风，经过指尖。</h1><p class="subtitle">慢慢划过，看枝叶轻摇。快一点，让几片叶子随风离开。</p></section><section class="garden" aria-label="枝条互动区域"><canvas id="scene" aria-label="按住鼠标或单指划动产生风。也可使用下方轻吹一下按钮。">浏览器未能显示画布，请换用支持 Canvas 的浏览器。</canvas><div class="scene-note"><span class="tiny-line"></span><span id="hint">按住并划动 · 风只经过你触碰的地方</span></div><div class="readout"><span id="remaining">54</span><small>片叶仍在枝头</small></div></section><section class="toolbar" aria-label="互动控制"><button id="breeze" class="primary"><span aria-hidden="true">≋</span> 轻吹一下</button><button id="reset"><span aria-hidden="true">↺</span> 重新长满</button><label class="motion"><input id="reduced" type="checkbox"><span class="switch"></span>减少动态</label></section><p id="status" class="status" role="status" aria-live="polite">每一片离开的叶子，都会留下自己的位置。</p><footer><span>风停后，枝条会慢慢回到原处。</span><span>独立枝叶 · 真实脱落 · 自然回弹</span></footer></main><script type="module" src="app.js"></script></body></html>
